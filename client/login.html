<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Log in to ShelfLife." />
    <meta name="theme-color" content="#f5f0e6" />
    <title>Log in | ShelfLife</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="page-auth">
    <div class="app">
      <div id="navbar"></div>
      <main class="main" id="main">
        <div class="container auth-layout">
          <form class="auth-form" id="login-form" novalidate>
            <h1>Welcome back</h1>
            <p class="auth-intro">Log in to scan photos, save foods and see your scan history.</p>
            <p class="notice" id="login-note" hidden></p>
            <p class="form-error" role="alert" hidden></p>

            <div class="field">
              <label for="login-email">Email</label>
              <input id="login-email" name="email" type="email" autocomplete="email" required />
              <p class="field-error" hidden></p>
            </div>
            <div class="field">
              <label for="login-password">Password</label>
              <input id="login-password" name="password" type="password" autocomplete="current-password" required />
              <p class="field-error" hidden></p>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Log in</button>
            <p class="auth-switch">New to ShelfLife? <a href="/signup" id="signup-link">Create an account</a></p>
          </form>
          <aside class="auth-aside auth-aside-tomato" aria-hidden="true">
            <div class="auth-lens"><img src="/images/foods/peach.webp" alt="" width="800" height="800" /></div>
            <p class="auth-aside-quote">“Use it soon.”</p>
            <p class="auth-aside-text">That's the kind of answer you get: one clear call for the food in front of you.</p>
          </aside>
        </div>
      </main>
      <div id="footer"></div>
    </div>
    <script type="module" src="/js/pages/login.js"></script>
  </body>
</html>
