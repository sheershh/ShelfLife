<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ShelfLife: estimated shelf life, storage tips and freshness guidance to help you waste less food." />
    <title>Login | ShelfLife</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="app">
      <div id="navbar"></div>
      <main class="main">
        <section class="container page-section auth-page">
          <form class="auth-card" id="login-form" novalidate>
            <h1>Login</h1>
            <p class="auth-intro">Welcome back to ShelfLife.</p>
            <p class="notice" id="login-note" hidden>Log in to save foods to your account.</p>
            <p class="form-error" role="alert" hidden></p>

            <div class="field">
              <label for="login-email">Email</label>
              <input id="login-email" name="email" type="email" autocomplete="email" />
              <p class="field-error" hidden></p>
            </div>

            <div class="field">
              <label for="login-password">Password</label>
              <input id="login-password" name="password" type="password" autocomplete="current-password" />
              <p class="field-error" hidden></p>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Login</button>

            <p class="auth-links">New here? <a href="/signup">Create an account</a></p>
            <p class="auth-links"><a href="/">← Back to Home</a></p>
          </form>
        </section>
      </main>
      <div id="footer"></div>
    </div>
    <script type="module" src="/js/pages/login.js"></script>
  </body>
</html>
