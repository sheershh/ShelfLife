<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ShelfLife: estimated shelf life, storage tips and freshness guidance to help you waste less food." />
    <title>Signup | ShelfLife</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="app">
      <div id="navbar"></div>
      <main class="main">
        <section class="container page-section auth-page">
          <form class="auth-card" id="signup-form" novalidate>
            <h1>Signup</h1>
            <p class="auth-intro">Create your ShelfLife account.</p>
            <p class="form-error" role="alert" hidden></p>

            <div class="field">
              <label for="signup-name">Name</label>
              <input id="signup-name" name="name" type="text" autocomplete="name" />
              <p class="field-error" hidden></p>
            </div>

            <div class="field">
              <label for="signup-email">Email</label>
              <input id="signup-email" name="email" type="email" autocomplete="email" />
              <p class="field-error" hidden></p>
            </div>

            <div class="field">
              <label for="signup-password">Password</label>
              <input id="signup-password" name="password" type="password" autocomplete="new-password" />
              <p class="field-hint">At least 8 characters, with a letter and a number.</p>
              <p class="field-error" hidden></p>
            </div>

            <div class="field">
              <label for="signup-confirm">Confirm password</label>
              <input id="signup-confirm" name="confirm" type="password" autocomplete="new-password" />
              <p class="field-error" hidden></p>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Signup</button>

            <p class="auth-links">Already have an account? <a href="/login">Login</a></p>
            <p class="auth-links"><a href="/">← Back to Home</a></p>
          </form>
        </section>
      </main>
      <div id="footer"></div>
    </div>
    <script type="module" src="/js/pages/signup.js"></script>
  </body>
</html>
