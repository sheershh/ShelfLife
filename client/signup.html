<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create a free ShelfLife account." />
    <meta name="theme-color" content="#f5f0e6" />
    <title>Create an account | ShelfLife</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="page-auth">
    <div class="app">
      <div id="navbar"></div>
      <main class="main" id="main">
        <div class="container auth-layout">
          <form class="auth-form" id="signup-form" novalidate>
            <h1>Create your account</h1>
            <p class="auth-intro">Free. Lets you scan photos, save foods and keep a history of your scans.</p>
            <p class="form-error" role="alert" hidden></p>

            <div class="field">
              <label for="signup-name">Name</label>
              <input id="signup-name" name="name" type="text" autocomplete="name" required />
              <p class="field-error" hidden></p>
            </div>
            <div class="field">
              <label for="signup-email">Email</label>
              <input id="signup-email" name="email" type="email" autocomplete="email" required />
              <p class="field-error" hidden></p>
            </div>
            <div class="field">
              <label for="signup-password">Password</label>
              <input id="signup-password" name="password" type="password" autocomplete="new-password" aria-describedby="password-hint" required />
              <p class="field-hint" id="password-hint">At least 8 characters, with a letter and a number.</p>
              <p class="field-error" hidden></p>
            </div>
            <div class="field">
              <label for="signup-confirm">Confirm password</label>
              <input id="signup-confirm" name="confirm" type="password" autocomplete="new-password" required />
              <p class="field-error" hidden></p>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Create account</button>
            <p class="auth-switch">Already have an account? <a href="/login" id="login-link">Log in</a></p>
          </form>
          <aside class="auth-aside auth-aside-green" aria-hidden="true">
            <div class="auth-lens"><img src="/images/foods/avocado.webp" alt="" width="800" height="800" /></div>
            <p class="auth-aside-quote">“Good to eat.”</p>
            <p class="auth-aside-text">Check fruit and vegetables before you cook, and learn how to store them so they last.</p>
          </aside>
        </div>
      </main>
      <div id="footer"></div>
    </div>
    <script type="module" src="/js/pages/signup.js"></script>
  </body>
</html>
