<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ShelfLife: estimated shelf life, storage tips and freshness guidance to help you waste less food." />
    <title>Explore Foods | ShelfLife</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="app">
      <div id="navbar"></div>
      <main class="main">
        <section class="container page-section">
          <div class="page-heading">
            <h1>Explore Foods</h1>
            <p>
              Search for a food or browse by category to see estimated shelf life, the best place to store it,
              and how to recognise freshness.
            </p>
          </div>

          <div class="filters">
            <div class="search-field">
              <label for="food-search">Search foods by name</label>
              <input id="food-search" type="search" placeholder="e.g. banana" autocomplete="off" />
            </div>
            <div class="category-filter" id="category-filter" role="group" aria-label="Filter by category"></div>
          </div>

          <p class="result-count" id="result-count" aria-live="polite"></p>
          <div id="food-results"><p class="status-text">Loading foods…</p></div>
        </section>
      </main>
      <div id="footer"></div>
    </div>
    <script type="module" src="/js/pages/foods.js"></script>
  </body>
</html>
